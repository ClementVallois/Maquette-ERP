name: Container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/clementvallois/maquette-erp

jobs:
  verify:
    name: Build and boot the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image into the local daemon
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: maquette-erp:verify
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The non-root, read-only image reaches its health check
        run: |
          # The placeholder key below is exactly 32 characters, which is the minimum
          # `scripts/check-env.ts` accepts. Shortening it makes the container refuse to start and
          # this job fails as "unhealthy", naming a timeout rather than the key.
          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:38080:3000 \
            --env DATABASE_URL=postgres://unused:unused@127.0.0.1:5432/unused \
            --env API_PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            --env SESSION_SIGNING_KEY=ci-image-healthcheck-placeholder \
            maquette-erp:verify)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1' EXIT

          healthy=0
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$status" = healthy ]; then
              healthy=1
              break
            fi
            if [ "$status" = unhealthy ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" -ne 1 ]; then
            docker logs "$container_id"
            exit 1
          fi

          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = 10001:10001

          # `healthy` only proves /healthz, which deliberately probes nothing (ops.ts) — it stayed
          # green once already while apps/web/dist was silently missing from the deploy projection
          # (.gitignore excludes build artifacts pnpm deploy still has to ship). Prove the SPA the
          # image actually serves it, not just that the process answers.
          shell_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:38080/)"
          test "$shell_status" = 200

          asset_path="$(curl --silent http://127.0.0.1:38080/ | grep -oE '/assets/[^"]+\.js' | head -n1)"
          test -n "$asset_path"
          asset_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:38080$asset_path")"
          test "$asset_status" = 200

  deploy-dry-run:
    name: Deploy script --dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # docs/BUILD-PLAN.md's TDD table: "Deploy scripts | A dry-run assertion where one exists" —
      # this is that assertion. It runs against deploy/test/fake-docker.sh, a recording stub, and
      # checks ADR-0029's own five listed absences (no pull, no migrate, no restart, no digest
      # state written, no backup) rather than only that the process exits 0.
      - name: pull-and-redeploy.sh --dry-run does none of the five things ADR-0029 forbids it
        run: bash deploy/test/dry-run.sh

  publish:
    name: Publish the signed digest
    if: ${{ github.event_name == 'push' }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR with the workflow's ephemeral token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the moving and immutable tags
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the immutable image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
