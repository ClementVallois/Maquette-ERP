# nginx vhost for the hosted mockup (ADR-0030): proxies to the app only, on this host's own
# 127.0.0.1:{{APP_PORT}} — nothing else on the box is reachable through this file. Installed by
# deploy/provision-host.sh at /etc/nginx/sites-available/erp.clementvallois.fr, with {{APP_PORT}}
# substituted for the value in /etc/erp-maquette/environment.
#
# TLS paths assume certbot's nginx plugin issued a certificate for exactly this domain
# (`certbot --nginx -d erp.clementvallois.fr`, provision-host.sh's certificate stage) — a second,
# separate certificate from the host's existing apex-domain one, not a shared or expanded cert.

limit_req_zone $binary_remote_addr zone=erp_maquette:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name erp.clementvallois.fr;

  # X-Robots-Tag here too (ADR-0032): this response is nginx's own redirect, not the app's.
  add_header X-Robots-Tag "noindex, nofollow" always;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name erp.clementvallois.fr;

  ssl_certificate /etc/letsencrypt/live/erp.clementvallois.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.clementvallois.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Security headers at the edge. The app's own Content-Security-Policy (ADR-0064) is not
  # duplicated here — one source for that header, set where the policy is decided.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # ADR-0032: a demo full of synthetic invoices has no business in a search index. The app already
  # sends this on every response it generates; repeated here for whatever nginx answers itself
  # (the redirect above, and any error page below).
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 1m;

  location / {
    limit_req zone=erp_maquette burst=20 nodelay;

    proxy_pass http://127.0.0.1:{{APP_PORT}};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
