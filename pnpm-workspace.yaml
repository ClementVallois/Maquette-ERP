packages:
  - 'packages/*'
  # What is deployed, as opposed to what is composed. Declared before it is populated because
  # vitest.config.ts and .dependency-cruiser.cjs already name `apps/**`. See docs/adr/0015.
  - 'apps/*'
  # The integration harness. A workspace member, not a directory reached by a relative path:
  # `rootDir` is `src` in every package, so a `../../../../tests/` climb puts a file outside
  # the package that imports it and `tsc --noEmit` fails with TS6059.
  - 'tests/harness'

# In pnpm 11 this key is not read from .npmrc. Without it, `pnpm add` reintroduces `^` ranges.
saveExact: true

# Allowlist for `ignore-scripts=true` (.npmrc). Each entry needs a reason.
allowBuilds:
  esbuild: true # vitest bundler
  lefthook: true # downloads its own binary
  unrs-resolver: true # native binding of the ESLint TypeScript resolver

# Transitive packages pinned exactly by a parent, so no `pnpm update` can reach them. Every key is
# version-qualified deliberately: it stops matching, and the entry retires itself, the day upstream
# moves. Not read from package.json in pnpm 11 — `pnpm.overrides` there is ignored with a warning.
# Procedure: docs/vulnerability-management.md.
overrides:
  # `typed-rest-client@2.3.1` (pulled in by @stryker-mutator/core) depends on `qs` at an exact
  # `6.15.1` — GHSA-q8mj-m7cp-5q26, fixed in 6.15.2. Raised to 6.16.0 on 03/09/2026: 6.15.2 is
  # itself the vulnerable version of GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer),
  # and GHSA-x5fp-wj9c-mxmx (array-limit bypass) wants >= 6.15.4.
  'qs@6.15.1': '6.16.0'
  # The same four advisories of 03/09/2026 on two lines of `fast-uri`: SSRF via malformed IPv6
  # normalization and via repeated hostname percent-decoding, host confusion via percent-encoded
  # scheme normalization and via skipped IDN canonicalization. Fixed in 3.1.6 and 4.1.3.
  #
  # The 3.x line is dev-only — `@commitlint/config-validator` reaches it through `ajv`, and
  # commitlint runs in a git hook and in CI, never in the API. The 4.x line is **production**:
  # `fastify` > `@fastify/ajv-compiler` > `fast-uri`, on the request path of every route this
  # mockup serves. Bumping `fastify` to 5.12.1 (which its own two moderate advisories of the same
  # day required anyway) does not reach it — `@fastify/ajv-compiler` pins `fast-uri` exactly — so
  # the production fix is this override, not the version bump.
  'fast-uri@3.1.5': '3.1.6'
  'fast-uri@4.1.2': '4.1.3'
