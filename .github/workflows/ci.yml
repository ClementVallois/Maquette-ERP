name: CI

on:
  push:
    branches: ['**']
  # `main` alone: `develop` was merged and deleted in Phase 0, and a trigger naming a branch that
  # cannot exist is a rule nobody will notice has stopped applying.
  pull_request:
    branches: [main]

permissions: {}

# `head_ref` on a pull request, `ref_name` on a push: a PR and a push on the same branch share
# a group and do not run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.13.1'

jobs:
  boundaries:
    name: Module boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: No declared arrow is crossed
        run: pnpm run boundaries

      - name: The rule still rejects a forbidden import
        run: pnpm exec vitest run --project unit tests/boundary-rule.test.ts

  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck

      # `.env` is gitignored, so `env:init` copies the template first. That makes the
      # template-vs-`.env` half of the check trivially true here — the half this job exists for is
      # the other one: a `${VAR:?}` added to compose.yml with no line in `.env.example`. Without
      # this step that drift merges green and breaks the next `docker compose up`.
      - name: Environment template has not drifted from compose.yml
        run: pnpm run env:init && pnpm run env:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:cov

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The service container runs no init scripts, so this step is the CI counterpart of
      # `docker/postgres/init/01-roles.sh` and must stay identical to it: same role, same grants,
      # same `public` default privileges, and — critically — run BEFORE the migrations, so tables
      # created afterwards inherit them. It stops here. The per-schema grants for `timesheet` and
      # `billing` are migration 001's job, and this workflow used to repeat them in a later step,
      # which meant a broken grant block in the migration merged green.
      - name: Create app role, as the local init script does
        run: |
          psql "postgres://erp_migration:erp_local_dev@localhost:5433/erp" <<'EOSQL'
            CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_local_dev';
            GRANT CONNECT ON DATABASE erp TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO erp_app;
          EOSQL
        env:
          PGPASSWORD: erp_local_dev

      - name: Run migrations
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - run: pnpm run test:int
        env:
          DATABASE_URL: postgres://erp_app:erp_local_dev@localhost:5433/erp
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

  migrations-replayed-twice:
    name: Migrations replayed twice
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run migrations (first pass)
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - name: Run migrations (second pass — must be a no-op)
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

  setup:
    name: Cold setup (migrate + seed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create app role, as the local init script does
        run: |
          psql "postgres://erp_migration:erp_local_dev@localhost:5433/erp" <<'EOSQL'
            CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_local_dev';
            GRANT CONNECT ON DATABASE erp TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO erp_app;
          EOSQL
        env:
          PGPASSWORD: erp_local_dev

      - name: Environment template sanity check
        run: pnpm run env:init && pnpm run env:check

      - name: Run migrations
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - name: Run seed (first pass)
        run: pnpm run seed
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - name: Run seed (second pass — must be idempotent)
        run: pnpm run seed
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      # The half the seed itself cannot prove: it runs as the schema OWNER, so a successful seed
      # says nothing about whether the least-privilege role the API actually uses can read what
      # was written. Phase 4's checkpoint deferred this here by name. Every table the API reads is
      # queried as `erp_app`, and the counts are asserted rather than merely printed — a `SELECT`
      # that answers zero rows also "succeeds".
      - name: The app role can read what the seed wrote
        run: |
          psql -v ON_ERROR_STOP=1 "postgres://erp_app:erp_local_dev@localhost:5433/erp" <<'EOSQL'
            DO $$
            DECLARE
              expected CONSTANT text[][] := ARRAY[
                ['public.offices','4'], ['public.practices','5'], ['public.personas','4'],
                ['public.consultants','9'], ['public.clients','5'], ['public.missions','7'],
                ['timesheet.cras','6'], ['billing.invoices','3'], ['public.domain_events','5']
              ];
              found bigint;
            BEGIN
              FOR i IN 1 .. array_length(expected, 1) LOOP
                EXECUTE format('SELECT count(*) FROM %s', expected[i][1]) INTO found;
                IF found <> expected[i][2]::bigint THEN
                  RAISE EXCEPTION 'erp_app reads % rows from %, expected %',
                    found, expected[i][1], expected[i][2];
                END IF;
              END LOOP;
              RAISE NOTICE 'erp_app reads every seeded table at the expected volume.';
            END
            $$;
          EOSQL
        env:
          PGPASSWORD: erp_local_dev

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a `pull_request` event the action asks the API for the PR's commits, which `contents`
      # alone does not grant. Without this the job dies with a 403 on the first PR ever opened —
      # the push path scans the history directly and never needed it.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      # Run as a digest-pinned container rather than an action: the action uploads SARIF, which
      # needs GitHub Advanced Security on a private repository.
      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --lockfile=/src/pnpm-lock.yaml

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Semgrep OSS rather than CodeQL: CodeQL code scanning requires GitHub Advanced Security on
      # a private repository, so it would fail every run until this repo is made public.
      # Revisit once it is public.
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be \
            semgrep scan --config=p/typescript --config=p/security-audit --error --metrics=off
