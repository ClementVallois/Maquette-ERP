# Temporary HTTP-only vhost, installed by deploy/provision-host.sh's certificate stage BEFORE a
# certificate exists for this domain — nginx cannot load the real vhost (erp.clementvallois.fr.conf)
# until /etc/letsencrypt/live/erp.clementvallois.fr/ exists, and `certbot --webroot` needs an
# HTTP server block routing this exact hostname's ACME challenge before it can create that
# directory. The wizard overwrites this file with the real one once the certificate is issued.
server {
  listen 80;
  listen [::]:80;
  server_name erp.clementvallois.fr;

  location /.well-known/acme-challenge/ {
    root /var/www/erp-certbot;
  }

  location / {
    return 404;
  }
}
