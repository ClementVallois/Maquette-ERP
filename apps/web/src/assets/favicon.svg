<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Maquette ERP">
  <!--
    Item 5, QA round 1: a shield (the firm sells cybersecurity consulting) holding a checkmark (an
    audited, validated record — the CRA-to-invoice chain this mockup proves). One fill colour, so
    it stays legible if a browser ever renders it monochrome, plus a white outline/stroke so the
    shape reads on a dark tab bar as well as a light one — `--primary` alone (`#1f4d7a`) is close
    enough to black at 16px that an unbordered fill on a dark bar loses its edges.
  -->
  <path
    d="M8 0.6 13.9 2.7 13.9 7.4C13.9 11.3 11.4 14.1 8 15.4 4.6 14.1 2.1 11.3 2.1 7.4L2.1 2.7Z"
    fill="#1f4d7a"
    stroke="#ffffff"
    stroke-width="0.9"
    stroke-linejoin="round"
  />
  <path
    d="M5.1 8.1 7.1 10.1 11 5.9"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
