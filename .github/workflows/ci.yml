name: CI

on:
  push:
    branches: ['**']
  # `main` alone: `develop` was merged and deleted in Phase 0, and a trigger naming a branch that
  # cannot exist is a rule nobody will notice has stopped applying.
  pull_request:
    branches: [main]

permissions: {}

# `head_ref` on a pull request, `ref_name` on a push: a PR and a push on the same branch share
# a group and do not run twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.13.1'

jobs:
  boundaries:
    name: Module boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: No declared arrow is crossed
        run: pnpm run boundaries

      - name: The rule still rejects a forbidden import
        run: pnpm exec vitest run --project unit tests/boundary-rule.test.ts

  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `apps/web` needs no entry of its own above: `pnpm run lint` is `eslint .` (repo-wide) and
      # `pnpm run typecheck` recurses into every workspace member's own `typecheck` script
      # (package.json script) — both already cover apps/web as of frontend-plan.md Phase 1.2/1.3,
      # the same way they cover every other member. `pnpm audit` (the `dependencies` job) is what
      # actually changed shape by apps/web existing: a React+Vite+Playwright tree is new surface.
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck

      # Neither lint nor typecheck runs a bundler. This is the only CI step that proves Vite can
      # actually produce apps/web/dist — the thing Phase 9.1 will serve.
      - run: pnpm --filter @erp/web build

      # `.env` is gitignored, so `env:init` copies the template first. That makes the
      # template-vs-`.env` half of the check trivially true here — the half this job exists for is
      # the other one: a `${VAR:?}` added to compose.yml with no line in `.env.example`. Without
      # this step that drift merges green and breaks the next `docker compose up`.
      - name: Environment template has not drifted from compose.yml
        run: pnpm run env:init && pnpm run env:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm run test:cov

  web-e2e:
    name: Playwright (apps/web, against the served build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The Gate of front-end plan Phase 9.6: the suite runs against `apps/web/dist` **served by the
    # API on 3000**, not against Vite. That is not a preference — it is the only topology that
    # sends the application's own `Content-Security-Policy` (Vite's dev server sends none), and the
    # only one that exercises the SPA fallback of task 9.1 rather than the dev proxy standing in
    # for it. `E2E_SERVED_BUILD=1` on the last step is what selects it; `playwright.config.ts`
    # documents the two topologies on its own side.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `.npmrc` sets `ignore-scripts=true`, so the browser download Playwright normally runs as
      # a postinstall never happens on its own — this has to be an explicit step, here and
      # locally, not an `allowBuilds` entry (a browser binary is not a native build artefact of
      # the package, `pnpm-workspace.yaml`'s existing three entries all are).
      - run: pnpm --filter @erp/web exec playwright install --with-deps chromium

      # `.env` is gitignored and never exists in CI, so `pnpm run api` (started by Playwright's
      # `webServer`) would find no configuration at all. `env:init` copies the tracked
      # `.env.example`, whose values are already the ones this job needs: `DATABASE_URL` on
      # localhost:5433, matching the service container's port mapping, and
      # `API_PUBLIC_ORIGIN=http://127.0.0.1:3000`, which is exactly the served topology (Phase 9.5
      # is where `.env.example` says so out loud).
      - run: pnpm run env:init

      # The service container runs no init scripts. Identical to `test-integration`'s own step and
      # to `docker/postgres/init/01-roles.sh`, and for the same reason: before the migrations, so
      # tables created afterwards inherit the default privileges.
      - name: Create app role, as the local init script does
        run: |
          psql "postgres://erp_migration:erp_local_dev@localhost:5433/erp" <<'EOSQL'
            CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_local_dev';
            GRANT CONNECT ON DATABASE erp TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO erp_app;
          EOSQL
        env:
          PGPASSWORD: erp_local_dev

      # Migrate and seed here rather than inside Playwright's `webServer` command: the local
      # topology resets through `docker compose`, which does not exist in this job. The config
      # chains `db:reset` only when `CI` is unset, and these two steps are its CI counterpart —
      # the journeys (Annexe B) mutate seeded rows and need a database that holds them.
      - run: pnpm run migrate
      - run: pnpm run seed

      # `E2E_SERVED_BUILD=1` makes `playwright.config.ts` start one server instead of two:
      # `pnpm --filter @erp/web build && pnpm run api`, with the API serving `dist` on 3000 as the
      # single origin. The build is chained into that command on purpose — a `dist/` older than the
      # sources would let this Gate pass against a stale bundle.
      - run: pnpm --filter @erp/web exec playwright test
        env:
          E2E_SERVED_BUILD: '1'

      - name: Upload the Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/tests/visual/report/
          retention-days: 7

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The service container runs no init scripts, so this step is the CI counterpart of
      # `docker/postgres/init/01-roles.sh` and must stay identical to it: same role, same grants,
      # same `public` default privileges, and — critically — run BEFORE the migrations, so tables
      # created afterwards inherit them. It stops here. The per-schema grants for `timesheet` and
      # `billing` are migration 001's job, and this workflow used to repeat them in a later step,
      # which meant a broken grant block in the migration merged green.
      - name: Create app role, as the local init script does
        run: |
          psql "postgres://erp_migration:erp_local_dev@localhost:5433/erp" <<'EOSQL'
            CREATE ROLE erp_app WITH LOGIN PASSWORD 'erp_local_dev';
            GRANT CONNECT ON DATABASE erp TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO erp_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE erp_migration IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO erp_app;
          EOSQL
        env:
          PGPASSWORD: erp_local_dev

      - name: Run migrations
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - run: pnpm run test:int
        env:
          DATABASE_URL: postgres://erp_app:erp_local_dev@localhost:5433/erp
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

  migrations-replayed-twice:
    name: Migrations replayed twice
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: erp_migration
          POSTGRES_PASSWORD: erp_local_dev
          POSTGRES_DB: erp
          PGTZ: UTC
          TZ: UTC
          POSTGRES_INITDB_ARGS: '--data-checksums'
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U erp_migration -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run migrations (first pass)
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

      - name: Run migrations (second pass — must be a no-op)
        run: pnpm run migrate
        env:
          MIGRATION_DATABASE_URL: postgres://erp_migration:erp_local_dev@localhost:5433/erp

  setup:
    name: Cold setup (migrate + seed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The composite `pnpm run setup` itself, exactly as the README's "Démarrer" section points a
      # reader at — env:init, env:check, `docker compose up -d --wait`, migrate, seed — nothing
      # re-implemented against a stand-in. Every other database job in this file uses a
      # `services:` Postgres container, because a `services:` container has no `docker compose`
      # for `setup`'s own second step to call. This job deliberately does not use `services:`, so
      # `docker compose up -d --wait` is reachable: `ubuntu-latest` ships Docker Engine and the
      # Compose v2 plugin on the runner directly (verified locally — same command, same image,
      # same `.env.example` — not on an actual Actions run, which this branch cannot trigger
      # before it merges). A `setup` broken by a typo in `package.json` — the first command a
      # stranger to this repository types — now ships red instead of green: the row of
      # 21/08/2026 in `docs/open-questions.md`.
      - name: The composite pnpm run setup, exactly as the README names it
        run: pnpm run setup

      - name: Fingerprint the database the first pass produced
        run: pnpm run seed:fingerprint | tee "$RUNNER_TEMP/first-pass.txt"

      - name: Run seed (second pass)
        run: pnpm run seed

      # What "prove idempotency" needs and running the seed twice does not give. The seed clears
      # every table inside one transaction and re-inserts, so a second pass **cannot** exit
      # non-zero — asserting `exit 0` asserts nothing. Comparing the two fingerprints closes both
      # halves of ADR-0022 at once: a non-idempotent pass moves a row count, and a
      # non-deterministic one moves every id — swapping `uuidv7Deterministic` for
      # `crypto.randomUUID` used to leave all nine jobs green and now fails here. `diff` also
      # names the table that moved, which an `exit 1` would not.
      #
      # What it does not cover: rows already present before the first pass. Both passes see them,
      # so both fingerprints agree. That is the seed's reset step, and it is asserted by the
      # step's own DELETEs rather than here.
      - name: The second pass produced exactly the same database
        run: |
          pnpm run seed:fingerprint > "$RUNNER_TEMP/second-pass.txt"
          diff -u "$RUNNER_TEMP/first-pass.txt" "$RUNNER_TEMP/second-pass.txt"

      # The half the seed itself cannot prove: it runs as the schema OWNER, so a successful seed
      # says nothing about whether the least-privilege role the API actually uses can read what
      # was written. Phase 4's checkpoint deferred this here by name. Every table the API reads is
      # queried as `erp_app`, and the counts are asserted rather than merely printed — a `SELECT`
      # that answers zero rows also "succeeds". The connection string is `DATABASE_URL` read out of
      # the `.env` that `setup`'s own `env:init` just wrote, rather than a second copy of the same
      # credentials pasted here: a value that drifted in `.env.example` would then fail loudly here
      # instead of being masked by a hard-coded literal that still happens to match.
      #
      # The numbers are the seed's own volume, so any change to the dataset lands here — deliberate:
      # a gate that accepted "more than zero" would have stayed green through item 6's roster
      # expansion without ever reading it. Every mismatch is collected and raised once, because
      # aborting on the first hid the eight tables behind `consultants` when that expansion landed.
      - name: The app role can read what the seed wrote
        run: |
          set -a
          . ./.env
          set +a
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" <<'EOSQL'
            DO $$
            DECLARE
              expected CONSTANT text[][] := ARRAY[
                ['public.offices','4'], ['public.practices','5'], ['public.personas','4'],
                ['public.consultants','48'], ['public.clients','5'], ['public.missions','7'],
                ['timesheet.cras','148'], ['billing.invoices','66'], ['public.domain_events','147']
              ];
              found bigint;
              mismatches text[] := ARRAY[]::text[];
            BEGIN
              FOR i IN 1 .. array_length(expected, 1) LOOP
                EXECUTE format('SELECT count(*) FROM %s', expected[i][1]) INTO found;
                IF found <> expected[i][2]::bigint THEN
                  mismatches := mismatches || format('%s reads %s rows, expected %s',
                    expected[i][1], found, expected[i][2]);
                END IF;
              END LOOP;
              IF array_length(mismatches, 1) IS NOT NULL THEN
                RAISE EXCEPTION 'erp_app: %', array_to_string(mismatches, '; ');
              END IF;
              RAISE NOTICE 'erp_app reads every seeded table at the expected volume.';
            END
            $$;
          EOSQL

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # On a `pull_request` event the action asks the API for the PR's commits, which `contents`
      # alone does not grant. Without this the job dies with a 403 on the first PR ever opened —
      # the push path scans the history directly and never needed it.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

      # Run as a digest-pinned container rather than an action: the action uploads SARIF, which
      # needs GitHub Advanced Security on a private repository.
      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --lockfile=/src/pnpm-lock.yaml

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Phase 8 put the production deploy path into shell — the redeploy, the nightly reset and
      # the host wizard all run as root on the host. Semgrep's `p/typescript` and
      # `p/security-audit` do not read bash, so until this job existed those scripts were the only
      # executable code in the repository with no static analysis on it at all. Digest-pinned
      # container for the same reason as osv-scanner and semgrep above.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            --severity=warning \
            deploy/*.sh deploy/test/*.sh scripts/*.sh

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Semgrep OSS rather than CodeQL: CodeQL code scanning requires GitHub Advanced Security on
      # a private repository, so it would fail every run until this repo is made public.
      # Revisit once it is public.
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be \
            semgrep scan --config=p/typescript --config=p/security-audit --error --metrics=off
