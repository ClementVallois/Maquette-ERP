services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # `:?` makes compose refuse to start and NAME the missing variable, instead of
      # interpolating an empty string.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — run `pnpm run env:init`}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # A worked day is a date. If the dev container is not UTC, timezone bugs on a CRA do not
      # reproduce locally.
      TZ: UTC
      PGTZ: UTC
      # postgres:18 moved the default PGDATA; pinning it keeps data inside the volume across
      # image upgrades.
      PGDATA: /var/lib/postgresql/data/pgdata
      # Checksums cannot be enabled after initialisation.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `$$` leaves expansion to the container shell. Expanded by compose instead, the probe can
      # green-light a database other than the configured one.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
