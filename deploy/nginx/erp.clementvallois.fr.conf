# nginx vhost for the hosted mockup (ADR-0030): proxies to the app only, on this host's own
# 127.0.0.1:{{APP_PORT}} — nothing else on the box is reachable through this file. Installed by
# deploy/provision-host.sh at /etc/nginx/sites-available/erp.clementvallois.fr, with {{APP_PORT}}
# substituted for the value in /etc/erp-maquette/environment.
#
# TLS is the host's existing wildcard certificate, never one issued for this hostname (ADR-0087):
# a named certificate would publish `erp.clementvallois.fr` in Certificate Transparency logs, which
# is what the host's catch-all default server exists to prevent. This repository issues nothing and
# writes nothing into /etc/letsencrypt; renewal is the host's, over DNS-01, and its existing
# renew_hook already reloads nginx.

# Two zones, not one, because the two kinds of traffic have request rates that differ by an order
# of magnitude and only one of them is a person acting (ADR-0088). A single cold load of the SPA
# fetches one document plus every content-hashed chunk the route needs — dozens of requests fired
# in parallel in well under a second, all of them static files. Metering those at a human's click
# rate is what made a browser refresh fail in production: the overflow was answered with nginx's
# own HTML 503 page, so the browser saw `text/html` where it expected a JavaScript module,
# refused it on `X-Content-Type-Options: nosniff` grounds, and rendered nothing.
limit_req_zone $binary_remote_addr zone=erp_maquette:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=erp_maquette_assets:10m rate=100r/s;

server {
  listen 80;
  listen [::]:80;
  server_name erp.clementvallois.fr;

  # X-Robots-Tag here too (ADR-0032): this response is nginx's own redirect, not the app's.
  add_header X-Robots-Tag "noindex, nofollow" always;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name erp.clementvallois.fr;

  ssl_certificate /etc/letsencrypt/live/clementvallois.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clementvallois.fr/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Only the two headers the application cannot set for itself. `Strict-Transport-Security` is a
  # statement about TLS, which terminates here and not in the app — same max-age as the host's
  # other vhosts, and deliberately without `includeSubDomains`, which they avoid; `X-Robots-Tag` is repeated from
  # ADR-0032 because nginx answers the redirect above and every error page itself, and those never
  # reach the app that would otherwise send it.
  #
  # `X-Frame-Options`, `X-Content-Type-Options`, `Referrer-Policy` and the CSP are deliberately NOT
  # repeated here, and the omission is mechanical rather than tidiness: `add_header` applies to
  # proxied responses too, so each one would arrive twice, and a browser reading two
  # `Referrer-Policy` values takes the LAST valid one. The edge would therefore have decided the
  # app's referrer policy — `apps/api/src/web/reply.ts` picks `same-origin` on purpose, with the
  # CSRF origin check that a wrong value here breaks written out next to it.
  add_header Strict-Transport-Security "max-age=63072000" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 1m;

  # Hoisted to the server, deliberately, now that there are two proxying locations below.
  # `proxy_set_header` and `proxy_http_version` inherit downward into a location that declares
  # none of its own, but they do NOT inherit sideways between sibling locations — duplicating them
  # per location is how one copy silently drifts. Dropping `Host` or `X-Forwarded-Proto` on either
  # branch would break the CSRF origin check `apps/api/src/web/reply.ts` documents.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The SPA's content-hashed bundle (`apps/api/src/web/spa.ts` serves it, `immutable`). `^~` so
  # this prefix wins outright and no regex location can ever be added above it by accident. Still
  # metered — an unmetered location on the internet-facing side of a security firm's own
  # demonstrator is not a thing this repository is willing to ship — but metered at the rate a
  # browser actually fetches static files, not at the rate a human clicks.
  location ^~ /assets/ {
    limit_req zone=erp_maquette_assets burst=200 nodelay;

    proxy_pass http://127.0.0.1:{{APP_PORT}};
  }

  location / {
    limit_req zone=erp_maquette burst=20 nodelay;

    proxy_pass http://127.0.0.1:{{APP_PORT}};
  }
}
