# nginx vhost for the hosted mockup (ADR-0030): proxies to the app only, on this host's own
# 127.0.0.1:{{APP_PORT}} — nothing else on the box is reachable through this file. Installed by
# deploy/provision-host.sh at /etc/nginx/sites-available/erp.clementvallois.fr, with {{APP_PORT}}
# substituted for the value in /etc/erp-maquette/environment.
#
# TLS paths assume certbot issued a certificate for exactly this domain through the webroot
# challenge provision-host.sh's certificate stage runs (`certbot certonly --webroot -w
# /var/www/erp-certbot`, against the ACME stub vhost next to this file) — a second, separate
# certificate from the host's existing apex-domain one, not a shared or expanded cert.

limit_req_zone $binary_remote_addr zone=erp_maquette:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name erp.clementvallois.fr;

  # X-Robots-Tag here too (ADR-0032): this response is nginx's own redirect, not the app's.
  add_header X-Robots-Tag "noindex, nofollow" always;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name erp.clementvallois.fr;

  ssl_certificate /etc/letsencrypt/live/erp.clementvallois.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/erp.clementvallois.fr/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Only the two headers the application cannot set for itself. `Strict-Transport-Security` is a
  # statement about TLS, which terminates here and not in the app; `X-Robots-Tag` is repeated from
  # ADR-0032 because nginx answers the redirect above and every error page itself, and those never
  # reach the app that would otherwise send it.
  #
  # `X-Frame-Options`, `X-Content-Type-Options`, `Referrer-Policy` and the CSP are deliberately NOT
  # repeated here, and the omission is mechanical rather than tidiness: `add_header` applies to
  # proxied responses too, so each one would arrive twice, and a browser reading two
  # `Referrer-Policy` values takes the LAST valid one. The edge would therefore have decided the
  # app's referrer policy — `apps/api/src/web/reply.ts` picks `same-origin` on purpose, with the
  # CSRF origin check that a wrong value here breaks written out next to it.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  client_max_body_size 1m;

  location / {
    limit_req zone=erp_maquette burst=20 nodelay;

    proxy_pass http://127.0.0.1:{{APP_PORT}};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
